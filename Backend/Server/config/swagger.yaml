openapi: 3.0.0
info:
  title: To-Do List API Documentation
  version: 1.0.0
  description: API documentation for Authentication and To-Do List services

servers:
  - url: http://localhost:5000
    description: Local Development Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Enter your JWT token in the format: Bearer <token>'

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          example: '66fa8590bc8945a0b784e123'
        name:
          type: string
          example: 'John Doe'
        email:
          type: string
          format: email
          example: 'john@example.com'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-07T10:30:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-07T10:30:00.000Z'

    SignupRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: 'John Doe'
        email:
          type: string
          format: email
          example: 'john@example.com'
        password:
          type: string
          format: password
          example: 'password123'

    SigninRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: 'john@example.com'
        password:
          type: string
          format: password
          example: 'password123'

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statuscode:
          type: integer
          example: 200
        message:
          type: string
          example: 'user login successfully'
        token:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'

    SignupResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statuscode:
          type: integer
          example: 201
        message:
          type: string
          example: 'user account created successfully'

    Todo:
      type: object
      properties:
        _id:
          type: string
          example: '67041a7c8f2b3e51a4231b89'
        user:
          type: string
          example: '66fa8590bc8945a0b784e123'
        title:
          type: string
          example: 'Finish backend assignment'
        description:
          type: string
          example: 'Implement auth and todos endpoints'
        status:
          type: string
          enum: [pending, in-progress, completed]
          example: 'pending'
        priority:
          type: string
          enum: [low, medium, high]
          example: 'high'
        dueDate:
          type: string
          format: date-time
          example: '2026-10-10T18:00:00.000Z'
        tags:
          type: array
          items:
            type: string
          example: ['work', 'urgent']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTodoRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: 'Buy groceries'
        description:
          type: string
          example: 'Milk, Eggs, Bread'
        status:
          type: string
          enum: [pending, in-progress, completed]
          default: pending
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
        dueDate:
          type: string
          format: date-time
          example: '2026-10-10T12:00:00.000Z'
        tags:
          type: array
          items:
            type: string
          example: ['shopping', 'home']

    UpdateTodoRequest:
      type: object
      properties:
        title:
          type: string
          example: 'Buy groceries and fruits'
        description:
          type: string
          example: 'Milk, Eggs, Bread, Apples'
        status:
          type: string
          enum: [pending, in-progress, completed]
        priority:
          type: string
          enum: [low, medium, high]
        dueDate:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string

    TodoListResponse:
      type: object
      properties:
        todos:
          type: array
          items:
            $ref: '#/components/schemas/Todo'
        total:
          type: integer
          example: 12
        page:
          type: integer
          example: 1
        pages:
          type: integer
          example: 2

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Error description'

paths:
  /api/auth/signup:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '400':
          description: Validation error or user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/signin:
    post:
      tags:
        - Auth
      summary: Login user
      description: Authenticate user and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigninRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Get current user profile
      description: Fetch details of authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/todos:
    post:
      tags:
        - Todos
      summary: Create a new todo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoRequest'
      responses:
        '201':
          description: Todo created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized

    get:
      tags:
        - Todos
      summary: Get all todos with filters and pagination
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [pending, in-progress, completed]
        - name: priority
          in: query
          description: Filter by priority
          schema:
            type: string
            enum: [low, medium, high]
        - name: search
          in: query
          description: Search term matching title or description
          schema:
            type: string
        - name: sortBy
          in: query
          description: Field to sort by
          schema:
            type: string
            default: createdAt
        - name: order
          in: query
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Todos list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoListResponse'
        '401':
          description: Unauthorized


  /api/todos/{id}:
    get:
      tags:
        - Todos
      summary: Get a single todo by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Todo ID
          schema:
            type: string
      responses:
        '200':
          description: Todo retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '404':
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized

    put:
      tags:
        - Todos
      summary: Update a todo by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Todo ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoRequest'
      responses:
        '200':
          description: Todo updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '404':
          description: Todo not found
        '401':
          description: Unauthorized

    delete:
      tags:
        - Todos
      summary: Delete a todo by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Todo ID
          schema:
            type: string
      responses:
        '200':
          description: Todo deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Todo not found
        '401':
          description: Unauthorized

  /api/todos/{id}/toggle:
    patch:
      tags:
        - Todos
      summary: Toggle todo status between completed and pending
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Todo ID
          schema:
            type: string
      responses:
        '200':
          description: Status toggled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '404':
          description: Todo not found
        '401':
          description: Unauthorized
